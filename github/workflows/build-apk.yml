name: Build Flora APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'flora-apk-project-fixed.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and locate Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -type f -iname 'flora-apk-project-fixed.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: Missing flora-apk-project-fixed.zip in the repository.'
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          BUILD_FILE="$(find extracted -type f -path '*/app/build.gradle' -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo 'ERROR: app/build.gradle not found in the ZIP.'
            find extracted -maxdepth 7 -type f | sort
            exit 1
          fi
          ANDROID_DIR="${BUILD_FILE%/app/build.gradle}"
          if [ ! -f "$ANDROID_DIR/settings.gradle" ]; then
            echo 'ERROR: settings.gradle is missing beside app/.'
            exit 1
          fi
          if [ ! -f "$ANDROID_DIR/app/src/main/assets/index.html" ]; then
            echo 'ERROR: app/src/main/assets/index.html is missing.'
            exit 1
          fi
          if [ ! -f "$ANDROID_DIR/app/src/main/java/com/owrhan/flora/MainActivity.kt" ]; then
            echo 'ERROR: MainActivity.kt is missing.'
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project located at: $ANDROID_DIR"

      - name: Remove duplicate imports if present
        shell: bash
        run: |
          python3 - "$ANDROID_DIR/app/src/main/java/com/owrhan/flora/MainActivity.kt" <<'PY'
          import sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              lines = f.readlines()
          seen = set()
          result = []
          for line in lines:
              s = line.strip()
              if s.startswith('import ') and s in seen:
                  continue
              if s.startswith('import '):
                  seen.add(s)
              result.append(line)
          with open(path, 'w', encoding='utf-8') as f:
              f.writelines(result)
          print('Duplicate imports checked.')
          PY

      - name: Build debug APK
        run: gradle -p "$ANDROID_DIR" assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p output
          cp "$APK" output/Flora-Marketing-APK.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flora-Marketing-APK
          path: output/Flora-Marketing-APK.apk
          if-no-files-found: error
          retention-days: 14
