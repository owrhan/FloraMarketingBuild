
name: Build Flora Marketing APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          unzip -q FloraMarketing-Android-Project-Blue-Icon-StatusBar-Fix.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/flora-android-project assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FloraMarketing-APK
          path: extracted/flora-android-project/app/build/outputs/apk/debug/app-debug.apk
