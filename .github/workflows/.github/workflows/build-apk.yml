
name: Build Flora APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/flora-apk-project*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and locate project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname 'flora-apk-project*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            echo "Upload flora-apk-project-fixed.zip to repository root."
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          HTML_FILE="$(find project -type f -path '*/app/src/main/assets/index.html' -print -quit)"

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: HTML file not found inside Android project."
            find project -maxdepth 8 -type f | sort
            exit 1
          fi

          ANDROID_DIR="${HTML_FILE%/app/src/main/assets/index.html}"

          if [ ! -f "$ANDROID_DIR/app/src/main/java/com/owrhan/flora/MainActivity.kt" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          echo "Android project: $ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Fix duplicate Activity imports
        shell: bash
        run: |
          FILE="$ANDROID_DIR/app/src/main/java/com/owrhan/flora/MainActivity.kt"

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          seen = set()
          result = []

          for line in lines:
              stripped = line.strip()
              if stripped.startswith("import ") and stripped in seen:
                  continue
              if stripped.startswith("import "):
                  seen.add(stripped)
              result.append(line)

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(result)

          print("Duplicate imports checked.")
          PY

      - name: Build debug APK
        run: gradle -p "$ANDROID_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flora-Marketing-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
