name: Build Flora APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/flora-apk-project*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE="$(find . -type f -iname 'flora-apk-project*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          ANDROID_DIR="$(find project -type f -path '*/app/src/main/assets/index.html' -print -quit | sed 's#/app/src/main/assets/index.html$##')"

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android project or index.html not found."
            find project -maxdepth 7 -type f | sort
            exit 1
          fi

          echo "Android project found at: $ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$ANDROID_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flora-Marketing-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
