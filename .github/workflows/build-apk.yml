name: Build Flora Marketing APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: unzip -q FloraMarketing-Android-Project-PDF-Fix.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/flora-android-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloraMarketing-APK
          path: extracted/flora-android-project/app/build/outputs/apk/debug/app-debug.apk
