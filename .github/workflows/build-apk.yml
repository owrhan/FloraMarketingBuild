
name: Build Flora APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/flora-apk-project*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Android project
        shell: bash
        run: |
          find . -maxdepth 4 -type f | sort
          ZIP_FILE="$(find . -type f -iname 'flora-apk-project*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found. Upload it to the repository root."
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          if [ ! -f project/app/src/main/assets/index.html ]; then
            echo "ERROR: Android project structure is incorrect."
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

      - name: Build debug APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Flora-Marketing-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
